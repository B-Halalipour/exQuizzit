<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><meta name="description" content="A little flag. A big world. Play exQuizzit, a country flag challenge by Behnoud Halalipour."><title>exQuizzit — Know your world</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><script src="flags.js" defer></script><script src="app.js" defer></script></head><body><div class="orb orb-one"></div><div class="orb orb-two"></div><header><a class="brand" href="#home" aria-label="exQuizzit home"><span class="brand-icon">✳</span>ex<span>Quizz</span>it<span class="brand-dot">.</span></a><nav aria-label="Main navigation"><a href="#home" data-nav="home">Play</a><a href="#leaderboard" data-nav="leaderboard">Leaderboard</a><button id="account" class="account">Log in <span>↗</span></button></nav></header><main id="app" tabindex="-1"></main><div id="notice" role="status" aria-live="polite"></div><footer><span>Made for curious minds. Built by <a href="https://github.com/B-Halalipour" target="_blank" rel="noopener">Behnoud Halalipour</a>.</span><a href="https://github.com/B-Halalipour/exQuizzit" target="_blank" rel="noopener">View the source ↗</a></footer><dialog id="auth-dialog" aria-labelledby="auth-title"><button class="dialog-close" aria-label="Close login">×</button><p class="eyebrow">YOUR NEXT ADVENTURE</p><h2 id="auth-title">Welcome back.</h2><p id="auth-subtitle" class="muted">Log in to keep your scores with you.</p><form id="auth-form"><label id="display-label" hidden>Display name<input name="displayName" maxlength="20" autocomplete="nickname"></label><label>Username<input name="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" autocomplete="username" placeholder="e.g. world_explorer"></label><label>Password<input type="password" name="password" minlength="8" required autocomplete="current-password" placeholder="At least 8 characters"></label><p id="auth-error" class="form-error" role="alert"></p><button class="primary" id="auth-submit">Log in <span>↗</span></button></form><button class="text-button" id="auth-switch">New here? Create an account</button><button class="text-button" id="guest">Just exploring? Play as a guest →</button><p class="fine">Only your display name and game scores appear on the leaderboard.</p></dialog></body></html>
